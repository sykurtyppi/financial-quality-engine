# P0-F: the 300-test offline suite, golden-report gate, calibration snapshot,
# provenance/basis lints — all previously bit only when run by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (offline suite)
        run: python -m pytest tests/ -q

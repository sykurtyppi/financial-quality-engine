# P0-F: the 300-test offline suite, golden-report gate, calibration snapshot,
# provenance/basis lints — all previously bit only when run by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Reproducible build: exact versions from requirements.lock, then the
          # project itself without re-resolving (pyproject ranges stay the
          # spec; the lock is what CI and the reference machine actually run).
          pip install -r requirements.lock
          pip install --no-deps -e .
      # Lock integrity: the installed set must be exactly the lock (no
      # unpinned transitive dependency resolved at whatever version is newest
      # that day), and every pyproject requirement pinned at an allowed version.
      - name: Lock integrity
        run: python scripts/check_lock.py
      # Lint and type check run inside the required `test` job so they gate
      # merges without a branch-protection change. Config: pyproject.toml.
      - name: Lint (ruff)
        run: ruff check app scripts tests
      - name: Type check (mypy)
        run: mypy
      - name: Test (offline suite)
        run: python -m pytest tests/ -q

# P0-F: the 300-test offline suite, golden-report gate, calibration snapshot,
# provenance/basis lints — all previously bit only when run by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Reproducible build: exact versions from requirements.lock, then the
          # project itself without re-resolving (pyproject ranges stay the
          # spec; the lock is what CI and the reference machine actually run).
          pip install -r requirements.lock
          pip install --no-deps -e .
      # Lock integrity: the installed set must be exactly the lock (no
      # unpinned transitive dependency resolved at whatever version is newest
      # that day), and every pyproject requirement pinned at an allowed version.
      - name: Lock integrity
        run: python scripts/check_lock.py
      # Lint and type check run inside the required `test` job so they gate
      # merges without a branch-protection change. Config: pyproject.toml.
      - name: Lint (ruff)
        run: ruff check app scripts tests
      - name: Type check (mypy)
        run: mypy
      - name: Test (offline suite)
        run: python -m pytest tests/ -q

  # The same gates as separate, visible checks (Hermes audit round 3: one
  # green `test` check is too coarse to say WHAT passed). `test` above stays
  # the required check and still runs everything; these can be marked
  # required in branch protection alongside it.
  lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: python scripts/check_lock.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: ruff check app scripts tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: mypy

  # The operator commands run as the operator runs them, offline, against
  # a seeded cache — and then with the inputs broken the way a filing
  # night breaks them (tests/integration/test_cli_drills.py).
  cli-drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: python -m pytest tests/integration/test_cli_drills.py tests/integration/test_drill.py -q

  # Not validated until a real case exists: the corpus gate on real filings.
  # Red on purpose until the operator pins a reviewed case built from real
  # SEC data (scripts/make_corpus_case.py, docs/corpus.md). Not part of the
  # required `test` check, so it never blocks a merge; it keeps "the corpus
  # passes" from being read as "the engine is validated".
  corpus-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - run: python -m pytest tests/integration/test_corpus.py -q
        env:
          FQE_REQUIRE_REAL_CORPUS: "1"

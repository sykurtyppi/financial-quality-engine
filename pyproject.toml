[project]
name = "financial-quality-engine"
version = "0.4.0"
description = "Earnings Quality & Narrative Drift Engine — deterministic, evidence-grounded statement analysis, validated honestly against real SEC data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tristan Alejandro" }]
keywords = ["sec", "edgar", "xbrl", "earnings-quality", "accruals", "beneish", "financial-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "hypothesis>=6"]
web = ["jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Round-15 finding 4: the setuptools default only ships `.py` files. Without
# this, wheels build cleanly but omit the Jinja templates the web UI needs,
# and `pip install`-from-wheel produces a broken app that only shows up when
# a route is actually hit. Editable installs (`pip install -e .`) mask the
# issue because they read from the source tree. Explicit is safer than magic
# `include-package-data = true` because it names what actually needs to ship.
[tool.setuptools.package-data]
"app.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    # Upstream-only: Starlette's TestClient warns that a future httpx major ("httpx2")
    # will be required. Not fixable in our code without a risky dependency swap; scope
    # the suppression tightly to that one message so real deprecations still surface.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

# Lint (CI, `ruff check app scripts tests`). No reformatting and no
# line-length rule during the 0.4.0 evaluation window: the aim is catching
# defects and dead code, not restyling files whose diffs reviewers must read.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length: not enforced (no reformat during the window)
    "B905",   # zip() without strict=: parsers deliberately truncate to the shortest column
    "UP042",  # StrEnum: changes str()/format() of members that rendered text depends on
]

[tool.ruff.lint.per-file-ignores]
# Scripts put the repo root on sys.path before importing app.
"scripts/*.py" = ["E402"]
# AGENTS.md §4 flag-only files: frozen until the 0.4.0 window closes, so they
# are not restyled here. Only import ordering is outstanding in them.
"app/config/scoring_config.py" = ["I001"]
"app/services/scoring/engine.py" = ["I001"]
"app/services/formulas/*.py" = ["I001"]
"app/services/narrative/*.py" = ["I001"]
"app/services/backtesting/{pit,outcomes,runner}.py" = ["I001"]

# Type check (CI, `mypy`). The new provenance-layer modules are checked
# strictly; everything else at mypy's defaults, with the modules that do not
# yet pass listed below as known debt — a new module, or a listed one fixed
# and removed, is held to the check from then on.
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.services.ingestion.composition",
    "app.services.ingestion.fields",
    "app.services.ingestion.payloads",
    "app.services.ingestion.precedence",
    "app.services.ingestion.selection",
    "app.services.metrics_registry",
    "app.services.provenance",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
# Known debt at 2026-09-22: mostly Optional narrowing mypy cannot see (the
# values are guarded at runtime). Flag-only modules among them stay here
# until the window closes.
module = [
    "app.services.backtesting.analysis",
    "app.services.backtesting.distressed_controls",
    "app.services.backtesting.kpi_validation",
    "app.services.backtesting.pit",
    "app.services.backtesting.survivorship",
    "app.services.brief.derived",
    "app.services.formulas.beneish",
    "app.services.formulas.capex",
    "app.services.ingestion.companyfacts_mapper",
    "app.services.ingestion.offerings",
    "app.services.journal.store",
    "app.services.narrative.narrative_metrics",
    "app.services.watch.poller",
    "app.services.watch.rearm",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Scripts are type-checked since 2026-09-24: `earnings_brief.py assume
# --derive` crashed on a missing keyword argument that only a run could find
# (Hermes audit round 3, finding 4). Known debt in these scripts is Optional
# narrowing and loose annotations, so only those codes are relaxed here —
# a missing or unexpected argument (`call-arg`) still fails the check. A
# script not listed is held to the full check.
module = [
    "analyze_backtest",
    "journal",
    "make_real_fixtures",
    "miss_test",
    "run_distressed_controls",
    "run_restatement_control",
    "spike_definition_isolation",
    "validate_thermometer",
    "verify_against_filings",
    "vintage",
    "watch",
    "wide_sweep",
]
disable_error_code = [
    "union-attr", "arg-type", "return-value", "operator", "var-annotated", "attr-defined",
    "misc", "assignment",
]

[project]
name = "financial-quality-engine"
version = "0.4.0"
description = "Earnings Quality & Narrative Drift Engine — deterministic, evidence-grounded statement analysis, validated honestly against real SEC data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tristan Alejandro" }]
keywords = ["sec", "edgar", "xbrl", "earnings-quality", "accruals", "beneish", "financial-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[project]
name = "financial-quality-engine"
version = "0.4.0"
description = "Earnings Quality & Narrative Drift Engine — deterministic, evidence-grounded statement analysis, validated honestly against real SEC data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tristan Alejandro" }]
keywords = ["sec", "edgar", "xbrl", "earnings-quality", "accruals", "beneish", "financial-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Round-15 finding 4: the setuptools default only ships `.py` files. Without
# this, wheels build cleanly but omit the Jinja templates the web UI needs,
# and `pip install`-from-wheel produces a broken app that only shows up when
# a route is actually hit. Editable installs (`pip install -e .`) mask the
# issue because they read from the source tree. Explicit is safer than magic
# `include-package-data = true` because it names what actually needs to ship.
[tool.setuptools.package-data]
"app.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    # Upstream-only: Starlette's TestClient warns that a future httpx major ("httpx2")
    # will be required. Not fixable in our code without a risky dependency swap; scope
    # the suppression tightly to that one message so real deprecations still surface.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

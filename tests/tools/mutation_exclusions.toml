# Reviewed surviving mutants. Each entry records what a person concluded
# about one survivor; `kind` says which conclusion (Hermes audit round 6):
#
# - "equivalent": no input can tell the mutant from the original. Excluded
#   from the kill rate and listed with its argument.
# - "accepted": the mutant DOES behave differently on some input, and that
#   was accepted: a deliberate policy boundary (a display cap), or a
#   difference reachable only on malformed input. Excluded from the rate but
#   listed on its own. Needs `owner` and `review_by` (a date); the run fails
#   once that date has passed, so an acceptance is looked at again.
# - "tracked": a known gap being worked. NOT excluded: it still counts as a
#   survivor; the summary only names it.
#
# One entry per mutant, recognised by module, operator and the ORIGINAL line
# (stripped), not by line number:
#
#   [[exclusion]]
#   kind = "equivalent"
#   path = "app/services/journal/resolver.py"
#   operator = "cmp"
#   source = "if ref.sign > 0 and ref.end >= period.period_end and ref not in out:"
#   reason = "why no input can tell the mutant from the original"
#
# An entry must match exactly one current site (none: the code it argued
# about has changed; several: add `change` or `function` to say which), and
# an entry without a reason or kind is refused. "Probably harmless" is a test
# gap, not an exclusion.
#
# For the `continue` operator, `source` is the guard line above the
# `continue`, then " continue" (a bare `continue` would match them all).

[[exclusion]]
kind = "equivalent"
path = "app/services/ingestion/restatements.py"
operator = "continue"
source = "if not isinstance(row, dict): continue"
reason = "A payload row is JSON: every non-dict (list, str, number, bool, null) raises TypeError on row[\"filed\"] in the try just below, whose except also continues. Skipping earlier or there is the same outcome."

[[exclusion]]
kind = "equivalent"
path = "app/services/ingestion/companyfacts_mapper.py"
operator = "continue"
source = "if not facts: continue"
reason = "An empty candidate builds an empty series, whose coverage key (0, 0, -rank) fails the `key[1] > 0` test, so it can never be chosen. Skipping it early only saves the work."

[[exclusion]]

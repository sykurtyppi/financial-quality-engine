[[exclusion]]
kind = "accepted"
path = "app/services/ingestion/restatements.py"
operator = "cmp"
source = "if (end - row_end).days <= 400 and row_end <= end:"
change = "<= -> < in `(end - row_end).days <= 400`"
reason = "NOT equivalent: a fact ending exactly 400 days before a derived quarter no longer adds its filing date as a rebuild date. 400 is a lookback buffer, not a boundary of the method: the facts a derived quarter is built from (the year-to-date or annual minuend, the prior year-to-date, the three prior quarters, composite parts) end at most about 280 days before it. An extra rebuild date can change the result only if the mapper's tag choice flips on that date."
owner = "repo owner"
review_by = 2026-11-20


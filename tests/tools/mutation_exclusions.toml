[[exclusion]]
kind = "equivalent"
path = "app/services/ingestion/companyfacts_mapper.py"
operator = "cmp"
source = "prev_end = quarter_ends[i - 1] if i > 0 else None"
function = "quarterly"
reason = "At i == 0 the mutant takes the LAST quarter end as the previous one. A year-to-date fact ending at the first quarter can only be paired with a fact of the same start ending there or later, so the implied quarter is zero or negative days long and fails the QTD_DAYS check: no value either way."

[[exclusion]]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Decision-Impact Journal{% endblock %}</title>
  <style>
    :root {
      --bg: #111318; --panel: #181b22; --panel-2: #20242d; --line: #2c323d; --ink: #eef1f5;
      --muted: #9aa3b2; --accent: #7dd3fc; --accent-ink: #06131a; --good: #6ee7b7; --warn: #facc15; --bad: #fb7185;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--line); padding: 14px 24px;
      display: flex; align-items: center; gap: 14px; background: #151820; position: sticky; top: 0; z-index: 2; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: 0; white-space: nowrap; }
    header .tag { font: 11px var(--mono); color: var(--muted);
      border: 1px solid var(--line); padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
    header nav { margin-left: auto; display: flex; gap: 18px; font-size: 14px; }
    header nav a { white-space: nowrap; }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 24px 80px; }
    h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0; }
    h3 { font-size: 14px; margin: 0 0 12px; color: var(--ink); letter-spacing: 0; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 13.5px; }
    .panel { background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 1px;
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
    .stat { background: var(--panel); padding: 14px 16px; min-width: 0; }
    .stat b { display: block; font: 24px/1.1 var(--mono); margin-bottom: 4px; }
    .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    tr:hover td { background: rgba(255,255,255,.018); }
    .case-title { display: flex; align-items: baseline; gap: 8px; }
    .muted { color: var(--muted); }
    .pill { display: inline-block; font: 11px var(--mono); padding: 2px 7px; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap; }
    .pill.need { color: var(--warn); border-color: #6b5d1b; background: #241f10; }
    .pill.ok { color: var(--good); border-color: #265a46; background: #10231d; }
    .pill.wait { color: var(--muted); background: #151820; }
    .pill.bad { color: var(--bad); border-color: #6b2637; background: #2a151c; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); }
    input, textarea, select {
      width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font: 14px/1.5 inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid rgba(125,211,252,.35); border-color: var(--accent); }
    textarea { min-height: 84px; resize: vertical; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-ink); border: 0;
      padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn.small { padding: 6px 10px; font-size: 12.5px; }
    .btn:hover { text-decoration: none; opacity: .92; }
    .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    .err { color: var(--bad); background: #2a1618; border: 1px solid #4a2226;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
    .note { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
    .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr); gap: 18px; align-items: start; }
    .split > * { min-width: 0; }
    .queue { display: grid; gap: 10px; }
    .queue-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--line); }
    .queue-item:last-child { border-bottom: 0; }
    .empty { color: var(--muted); margin: 0; }
    .field-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .field-grid .wide { grid-column: span 4; }
    /* rendered report */
    .report { font-size: 14px; }
    .report h1 { font-size: 20px; } .report h2 { font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-top: 26px; }
    .report h3 { font-size: 14px; color: var(--muted); }
    .report table { margin: 10px 0; } .report code { font: 12.5px var(--mono); color: #cbd5e1; }
    .report blockquote { border-left: 3px solid var(--line); margin: 12px 0; padding: 4px 14px; color: var(--muted); }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-wrap: wrap; }
      header nav { width: 100%; margin-left: 0; gap: 14px; }
      main { padding: 22px 14px 64px; }
      .toolbar, .queue-item { align-items: stretch; flex-direction: column; }
      .summary, .split, .row, .field-grid { grid-template-columns: 1fr; }
      .field-grid .wide { grid-column: auto; }
      .panel { padding: 16px 14px; min-width: 0; }
      table { display: block; overflow-x: auto; }
      table { font-size: 13px; }
      th, td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Decision-Impact Journal</h1>
    <span class="tag">dogfooding tool · not the product</span>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/open">New case</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>

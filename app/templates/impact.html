{% extends "base.html" %}
{% block body %}
<div class="toolbar">
  <div>
    <h2>{{ entry.ticker }} Impact</h2>
    <p class="sub" style="margin:0">{{ entry.day }} · prior conviction {{ entry.conviction or "—" }}</p>
  </div>
  <div class="actions" style="margin:0">
    <a class="btn ghost" href="/report/{{ entry.ticker }}?date={{ entry.day }}">Report</a>
    <a class="btn ghost" href="/">Dashboard</a>
  </div>
</div>

<div class="panel">
  <h3>Prior View</h3>
  <p style="margin:0">{{ entry.thesis or "No thesis captured" }}</p>
</div>

<form class="panel" method="post" action="/impact/{{ entry.ticker }}">
  <input type="hidden" name="date" value="{{ entry.day }}">

  <h3>After</h3>
  <div class="row">
    <div>
      <label for="impact">Impact</label>
      <select id="impact" name="impact">
        <option value="">— select —</option>
        {% for code in impact_codes %}
        <option value="{{ code }}" {% if entry.impact == code %}selected{% endif %}>{{ code }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="conviction_after">Conviction after (1–5)</label>
      <select id="conviction_after" name="conviction_after">
        <option value="">— unchanged / select —</option>
        {% for n in conviction_choices %}
        <option value="{{ n }}" {% if entry.conviction_after == n %}selected{% endif %}>{{ n }}{% if entry.conviction == n %} (prior){% endif %}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <label for="what_it_surfaced">What it surfaced</label>
  <textarea id="what_it_surfaced" name="what_it_surfaced" placeholder="new risk, evidence, or question">{{ entry.what_it_surfaced or '' }}</textarea>
  <label for="what_i_disagreed_with">What you disagreed with</label>
  <textarea id="what_i_disagreed_with" name="what_i_disagreed_with" placeholder="flag that was immaterial, stale, or already priced">{{ entry.what_i_disagreed_with or '' }}</textarea>

  <h3 style="margin-top:26px">Outcome</h3>
  <div class="row">
    <div>
      <label for="outcome_date">Outcome date</label>
      <input id="outcome_date" name="outcome_date" value="{{ entry.outcome_date or '' }}" placeholder="2026-08-15">
    </div>
    <div>
      <label for="verdict">Verdict</label>
      <select id="verdict" name="verdict">
        <option value="">— select —</option>
        {% for v in verdicts %}
        <option value="{{ v }}" {% if entry.verdict == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <label for="what_happened">What happened</label>
  <textarea id="what_happened" name="what_happened" placeholder="what actually played out">{{ entry.what_happened or '' }}</textarea>

  <div class="actions">
    <button class="btn" type="submit">Save</button>
    <a class="btn ghost" href="/">Cancel</a>
  </div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block body %}
<div class="toolbar">
  <div>
    <h2>New case</h2>
    <p class="sub" style="margin:0">Capture the prior view before the report exists.</p>
  </div>
  <a class="btn ghost" href="/">Dashboard</a>
</div>

{% if error %}<div class="err">{{ error }}</div>{% endif %}

<form class="panel" method="post" action="/open">
  <div class="field-grid">
    <div>
      <label for="ticker">Ticker</label>
      <input id="ticker" name="ticker" required autocomplete="off" placeholder="NVDA" style="text-transform:uppercase">
    </div>
    <div>
      <label for="conviction">Conviction (1–5)</label>
      <select id="conviction" name="conviction">
        <option value="1">1 — low</option><option value="2">2</option>
        <option value="3" selected>3</option><option value="4">4</option>
        <option value="5">5 — high</option>
      </select>
    </div>
    <div>
      <label for="action">Intended action</label>
      <select id="action" name="action">
        <option value="hold" selected>hold</option>
        <option value="add">add</option>
        <option value="trim">trim</option>
        <option value="avoid">avoid</option>
        <option value="no position">no position</option>
      </select>
    </div>
    <div>
      <label for="source">Case source</label>
      <input id="source" disabled value="journal entry">
    </div>

    <div class="wide">
      <label for="thesis">Thesis</label>
      <textarea id="thesis" name="thesis" required placeholder="beat likely priced in; watching inventory build and margin quality"></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="btn" type="submit">Create case</button>
    <a class="btn ghost" href="/">Cancel</a>
  </div>
  <p class="note">The report action will lock this thesis once generation succeeds.</p>
</form>
{% endblock %}
